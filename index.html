<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="%VITE_SITE_DESCRIPTION%" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:title" content="%VITE_SITE_NAME% – %VITE_SITE_TAGLINE%" />
  <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1490750967868-88df5691cc60?auto=format&fit=crop&q=80&w=1200" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%VITE_SITE_NAME% – %VITE_SITE_TAGLINE%" />
  <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
  <meta name="twitter:image"
    content="https://images.unsplash.com/photo-1490750967868-88df5691cc60?auto=format&fit=crop&q=80&w=1200" />

  <!-- JSON-LD: Local Business -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Florist",
      "name": "%VITE_SITE_NAME%",
      "description": "%VITE_SITE_DESCRIPTION%",
      "url": "%VITE_SITE_URL%",
      "telephone": "%VITE_BUSINESS_PHONE_E164%",
      "email": "%VITE_BUSINESS_EMAIL%",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "%VITE_BUSINESS_ADDRESS%",
        "addressCountry": "DE"
      },
      "openingHours": "%VITE_BUSINESS_HOURS%",
      "priceRange": "%VITE_BUSINESS_PRICE_RANGE%",
      "sameAs": []
    }
    </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet" />
  <title>%VITE_SITE_NAME% – %VITE_SITE_TAGLINE%</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
